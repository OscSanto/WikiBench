[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibench"
version = "0.1.0"
description = "Retrieval benchmark suite for wikembed indexes"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.3",
    "faiss-cpu>=1.7",
    "requests>=2.31",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "streamlit>=1.35",
    "numpy>=1.24",
]

[project.optional-dependencies]
beir = [
    "datasets>=2.19",
    "pytrec-eval-terrier>=0.5",
]

[project.scripts]
wikibench = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wikibench*"]
